<!DOCTYPE html>

<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MovieBox</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="cabecalho">

        <h1>MovieBox</h1>

        <nav>
            <a href="#">Início</a>
            <a href="#">Favoritos</a>
        </nav>

    </header>


    <main>

        <section class="hero">

            <div class="hero_conteudo">

                <h2>Encontre seu próximo filme</h2>

                <p>
                    Pesquise filmes e descubra novas histórias para assistir.
                </p>

                <div class="busca">

                    <input
                        type="text"
                        id="campo_busca"
                        placeholder="Pesquisar filme..."
                    >

                    <button
                        type="button"
                        id="botao_busca"
                    >
                        Pesquisar
                    </button>

                </div>

            </div>

        </section>


        <section class="filmes">

            <h2>Filmes populares</h2>

            <div
                class="lista_filmes"
                id="lista_filmes"
            ></div>

        </section>

    </main>


    <script src="config.js"></script>
    <script src="script.js"></script>

</body>

</html>
