<DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MovieBox</title>
</head>

<body>

    <header>
        <h1>MovieBox</h1>
    
        <nav>
            <a href=#>"Início"</a>
            <a href=#>"Favoritos"</a>
        </nav>
    </header>

    <main>
        
        <section>
            <h2>Encontre seu próximo filme</h2>
            <p>Pesquise filmes e descubra novas histórias para assistir.</p>

            <div>
                <input 
                type="text"
                placeholder="Pesquisar filme...">

                <button type="button">
                    Pesquisar
                </button>
            </div>
        </section>

        <section>
            <h2>Filmes populares</h2>

            <div>
                <article>
                    <h3>Garota Exemplar</h3>
                    <p>⭐ 8.7</p>
                </article>

                <article>
                    <h3>O Poderoso Chefão</h3>
                    <p>⭐ 9.2</p>
                </article>

                <article>
                    <h3>Acompanhante Perfeita</h3>
                    <p>⭐ 8.6</p>
                </article>

            </div>
        </section>

    </main>

</body>

</html>
</DOCTYPE>
