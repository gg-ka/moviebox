<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MovieBox</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="cabecalho">
        <h1 class="logo">MovieBox</h1>

        <nav>
            <a href="#" id="link_inicio">Início</a>
            <a href="#" id="link_favoritos">Favoritos</a>
        </nav>

        <div class="busca_topo">
            <input
                type="text"
                id="campo_busca"
                placeholder="Pesquisar filmes..."
                aria-label="Pesquisar filmes"
            >

            <button
                type="button"
                id="botao_busca"
                aria-label="Pesquisar"
                title="Pesquisar"
            >
                🔍
            </button>
        </div>
    </header>

    <main>
        <section class="destaque" id="destaque">
            <div class="destaque_conteudo">
                <span class="destaque_selo">FILME EM DESTAQUE</span>

                <h2 id="destaque_titulo">Carregando destaque...</h2>

                <div class="destaque_meta">
                    <span id="destaque_ano"></span>
                    <span class="separador_meta">•</span>
                    <span id="destaque_nota"></span>
                </div>

                <p
                    class="destaque_sinopse"
                    id="destaque_sinopse"
                ></p>

                <div class="destaque_acoes">
                    <button
                        type="button"
                        class="destaque_botao destaque_botao_principal"
                        id="destaque_trailer"
                    >
                        ▶ Assistir trailer
                    </button>

                    <button
                        type="button"
                        class="destaque_botao destaque_botao_secundario"
                        id="destaque_detalhes"
                    >
                        ⓘ Ver detalhes
                    </button>
                </div>
            </div>
        </section>

        <section class="filmes">
            <div class="secao_cabecalho">
                <div>
                    <span class="secao_selo">CATÁLOGO</span>
                    <h2 id="titulo_secao">Filmes populares</h2>
                </div>
            </div>

            <div
                class="lista_filmes"
                id="lista_filmes"
            ></div>
        </section>
    </main>

    <div class="modal" id="modal">
        <div class="modal_conteudo">
            <button
                type="button"
                class="fechar_modal"
                id="fechar_modal"
                aria-label="Fechar detalhes do filme"
            >
                ×
            </button>

            <div id="detalhes_filme"></div>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="script.js"></script>
</body>
</html>
