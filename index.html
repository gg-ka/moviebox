<!DOCTYPE html>

<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MovieBox</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>


<body>

    <!-- =========================
         CABEÇALHO
    ========================== -->

    <header class="cabecalho">

        <h1 class="logo">
            MovieBox
        </h1>


        <nav>

            <a
                href="#"
                id="link_inicio"
            >
                Início
            </a>

            <a
                href="#"
                id="link_favoritos"
            >
                Favoritos
            </a>

        </nav>


        <div class="busca_topo">

            <input
                type="text"
                id="campo_busca"
                placeholder="Pesquisar filmes..."
                aria-label="Pesquisar filmes"
            >

            <button
                type="button"
                id="botao_busca"
                aria-label="Pesquisar"
            >
                <svg
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                >
                    <circle
                        cx="11"
                        cy="11"
                        r="7"
                    ></circle>

                    <path
                        d="M16.5 16.5L21 21"
                    ></path>
                </svg>
            </button>

        </div>

    </header>



    <main>

        <!-- =========================
             FILME EM DESTAQUE
        ========================== -->

        <section
            class="destaque"
            id="destaque"
        >

            <div class="destaque_conteudo">

                <span class="destaque_selo">
                    FILME EM DESTAQUE
                </span>


                <h2 id="destaque_titulo">
                    Carregando destaque...
                </h2>


                <div class="destaque_meta">

                    <span id="destaque_ano"></span>

                    <span class="separador_meta">
                        •
                    </span>

                    <span id="destaque_nota"></span>

                </div>


                <p
                    class="destaque_sinopse"
                    id="destaque_sinopse"
                ></p>


                <div class="destaque_acoes">

                    <button
                        type="button"
                        class="destaque_botao destaque_botao_principal"
                        id="destaque_trailer"
                    >
                        ▶ Assistir trailer
                    </button>


                    <button
                        type="button"
                        class="destaque_botao destaque_botao_secundario"
                        id="destaque_detalhes"
                    >
                        ⓘ Ver detalhes
                    </button>

                </div>

            </div>

        </section>



        <!-- =========================
             CATÁLOGO DA HOME
        ========================== -->

        <section
            class="catalogo_home"
            id="catalogo_home"
        >


            <!-- =====================
                 FILMES POPULARES
            ====================== -->

            <section class="categoria">

                <div class="secao_cabecalho">

                    <div>

                        <span class="secao_selo">
                            CATÁLOGO
                        </span>

                        <h2>
                            Filmes populares
                        </h2>

                    </div>

                </div>


                <div class="carrossel_container">

                    <button
                        type="button"
                        class="botao_carrossel botao_anterior"
                        aria-label="Ver filmes anteriores"
                    >
                        ‹
                    </button>


                    <div
                        class="carrossel_filmes"
                        id="lista_populares"
                    ></div>


                    <button
                        type="button"
                        class="botao_carrossel botao_proximo"
                        aria-label="Ver próximos filmes"
                    >
                        ›
                    </button>

                </div>

            </section>



            <!-- =====================
                 MAIS BEM AVALIADOS
            ====================== -->

            <section class="categoria">

                <div class="categoria_topo">

                    <h2>
                        Mais bem avaliados
                    </h2>

                </div>


                <div class="carrossel_container">

                    <button
                        type="button"
                        class="botao_carrossel botao_anterior"
                        aria-label="Ver filmes anteriores"
                    >
                        ‹
                    </button>


                    <div
                        class="carrossel_filmes"
                        id="lista_avaliados"
                    ></div>


                    <button
                        type="button"
                        class="botao_carrossel botao_proximo"
                        aria-label="Ver próximos filmes"
                    >
                        ›
                    </button>

                </div>

            </section>



            <!-- =====================
                 EM CARTAZ
            ====================== -->

            <section class="categoria">

                <div class="categoria_topo">

                    <h2>
                        Em cartaz
                    </h2>

                </div>


                <div class="carrossel_container">

                    <button
                        type="button"
                        class="botao_carrossel botao_anterior"
                        aria-label="Ver filmes anteriores"
                    >
                        ‹
                    </button>


                    <div
                        class="carrossel_filmes"
                        id="lista_cartaz"
                    ></div>


                    <button
                        type="button"
                        class="botao_carrossel botao_proximo"
                        aria-label="Ver próximos filmes"
                    >
                        ›
                    </button>

                </div>

            </section>



            <!-- =====================
                 PRÓXIMOS LANÇAMENTOS
            ====================== -->

            <section class="categoria">

                <div class="categoria_topo">

                    <h2>
                        Próximos lançamentos
                    </h2>

                </div>


                <div class="carrossel_container">

                    <button
                        type="button"
                        class="botao_carrossel botao_anterior"
                        aria-label="Ver filmes anteriores"
                    >
                        ‹
                    </button>


                    <div
                        class="carrossel_filmes"
                        id="lista_lancamentos"
                    ></div>


                    <button
                        type="button"
                        class="botao_carrossel botao_proximo"
                        aria-label="Ver próximos filmes"
                    >
                        ›
                    </button>

                </div>

            </section>

        </section>



        <!-- =========================
             PESQUISA / FAVORITOS
        ========================== -->

        <section
            class="filmes resultados_view oculto"
            id="resultados_view"
        >

            <div class="secao_cabecalho">

                <div>

                    <span
                        class="secao_selo"
                        id="selo_resultados"
                    >
                        CATÁLOGO
                    </span>


                    <h2 id="titulo_secao">
                        Resultados
                    </h2>

                </div>

            </div>


            <div
                class="lista_filmes"
                id="lista_filmes"
            ></div>

        </section>

    </main>



    <!-- =========================
         MODAL DE DETALHES
    ========================== -->

    <div
        class="modal"
        id="modal"
    >

        <div class="modal_conteudo">

            <button
                type="button"
                class="fechar_modal"
                id="fechar_modal"
                aria-label="Fechar detalhes do filme"
            >
                ×
            </button>


            <div id="detalhes_filme"></div>

        </div>

    </div>



    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script src="script.js"></script>

</body>

</html>
